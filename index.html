<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی شکارچی لوزی</title>
    <!-- لود فونت زیبای وزیر -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: #1a1b1e; /* طوسی تیره */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #2d3035;
        }

        canvas {
            display: block;
            background-color: #121316; /* طوسی بسیار تیره برای صفحه بازی */
            cursor: none; /* مخفی کردن نشانگر ماوس */
        }

        /* لایه رابط کاربری (UI) */
        .ui-layer {
            position: absolute;
            top: 20px;
            right: 25px;
            left: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .score-box {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            background: rgba(30, 32, 37, 0.85);
            padding: 8px 18px;
            border-radius: 12px;
            border: 1px solid #333842;
        }

        .score-val {
            color: #ff7700; /* نارنجی */
            font-weight: 900;
            font-size: 24px;
        }

        /* راهنما */
        .hint {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: #6c727f;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-layer">
        <div class="score-box">دایره‌های نابودشده: <span class="score-val" id="score">0</span></div>
        <div class="score-box">بیشترین امتیاز: <span class="score-val" id="highScore">0</span></div>
    </div>
    <div class="hint">لوزی نارنجی را با ماوس یا لمس حرکت دهید و دایره‌ها را شکار کنید!</div>
    <canvas id="gameCanvas" width="800" height="550"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');

    let score = 0;
    let highScore = 0;

    // بازیکن (لوزی نارنجی)
    const player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        targetX: canvas.width / 2,
        targetY: canvas.height / 2,
        size: 22, // شعاع لوزی
        angle: 0
    };

    // لیست دایره‌ها و ذرات متلاشی شده
    let circles = [];
    let particles = [];

    // ایجاد یک دایره جدید
    function spawnCircle() {
        const radius = Math.random() * 10 + 12; // بین ۱۲ تا ۲۲
        let x, y;
        // از لبه‌های صفحه وارد شوند
        if (Math.random() < 0.5) {
            x = Math.random() < 0.5 ? -radius : canvas.width + radius;
            y = Math.random() * canvas.height;
        } else {
            x = Math.random() * canvas.width;
            y = Math.random() < 0.5 ? -radius : canvas.height + radius;
        }

        // زاویه و سرعت حرکت
        const speed = Math.random() * 1.5 + 1.2;
        const targetAngle = Math.atan2(canvas.height / 2 - y, canvas.width / 2 - x) + (Math.random() - 0.5);
        
        circles.push({
            x: x,
            y: y,
            radius: radius,
            vx: Math.cos(targetAngle) * speed,
            vy: Math.sin(targetAngle) * speed
        });
    }

    // ساخت ذرات انفجار هنگام کشته شدن دایره
    function createExplosion(x, y) {
        for (let i = 0; i < 15; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 4 + 1.5;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: Math.random() * 3 + 1.5,
                alpha: 1,
                color: Math.random() > 0.4 ? '#ffffff' : '#ff7700'
            });
        }
    }

    // رسم لوزی
    function drawDiamond(x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        
        // افکت نور و درخشش نارنجی
        ctx.shadowColor = '#ff7700';
        ctx.shadowBlur = 18;

        ctx.beginPath();
        ctx.moveTo(0, -size * 1.2);   // رأس بالا
        ctx.lineTo(size, 0);          // رأس راست
        ctx.lineTo(0, size * 1.2);    // رأس پایین
        ctx.lineTo(-size, 0);         // رأس چپ
        ctx.closePath();

        ctx.fillStyle = '#ff7700'; // رنگ اصلی نارنجی
        ctx.fill();

        // یک لوزی کوچک‌تر سفید داخل آن برای زیبایی و برق زدن
        ctx.beginPath();
        ctx.moveTo(0, -size * 0.4);
        ctx.lineTo(size * 0.35, 0);
        ctx.lineTo(0, size * 0.4);
        ctx.lineTo(-size * 0.35, 0);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 0;
        ctx.fill();

        ctx.restore();
    }

    // کنترل با ماوس
    window.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        player.targetX = e.clientX - rect.left;
        player.targetY = e.clientY - rect.top;
    });

    // کنترل لمسی برای موبایل و تبلت
    window.addEventListener('touchmove', (e) => {
        const rect = canvas.getBoundingClientRect();
        player.targetX = e.touches[0].clientX - rect.left;
        player.targetY = e.touches[0].clientY - rect.top;
    }, { passive: false });

    // حلقه اصلی بازی
    let spawnCounter = 0;

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ۱. حرکت روان لوزی به سمت نشانگر ماوس
        player.x += (player.targetX - player.x) * 0.15;
        player.y += (player.targetY - player.y) * 0.15;

        // ۲. ظاهر کردن دایره‌ها
        spawnCounter++;
        if (spawnCounter % 40 === 0 && circles.length < 15) {
            spawnCircle();
        }

        // ۳. به‌روزرسانی و رسم دایره‌ها
        for (let i = circles.length - 1; i >= 0; i--) {
            const c = circles[i];
            c.x += c.vx;
            c.y += c.vy;

            // رسم دایره سفید
            ctx.save();
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();

            // بررسی برخورد لوزی با دایره (کشتن دایره)
            const dist = Math.hypot(player.x - c.x, player.y - c.y);
            if (dist < player.size + c.radius) {
                createExplosion(c.x, c.y);
                circles.splice(i, 1);
                score++;
                scoreEl.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.innerText = highScore;
                }
                continue;
            }

            // حذف دایره‌هایی که بیش از حد از صفحه دور شده‌اند
            if (c.x < -60 || c.x > canvas.width + 60 || c.y < -60 || c.y > canvas.height + 60) {
                circles.splice(i, 1);
            }
        }

        // ۴. رسم و به‌روزرسانی ذرات انفجار
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.035;

            if (p.alpha <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.restore();
        }

        // ۵. رسم لوزی (شخصیت اصلی)
        drawDiamond(player.x, player.y, player.size);

        requestAnimationFrame(gameLoop);
    }

    // شروع بازی
    gameLoop();
</script>

</body>
</html>
